<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08090d">
<title>Ritual Royale</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="game">
  <header class="top">
    <div><span class="sigil">☠</span><div><b>RITUAL ROYALE</b><small>Duelo Paranormal</small></div></div>
    <div class="timer" id="timer">03:00</div>
  </header>

  <section class="arena" id="arena">
    <div class="energy"><span>ENERGIA</span><strong id="energy">5</strong><i></i></div>
    <div class="tower enemy left" data-hp="100"><span>TORRE</span><b>100</b></div>
    <div class="tower enemy right" data-hp="100"><span>TORRE</span><b>100</b></div>
    <div class="tower player left" data-hp="100"><span>TORRE</span><b>100</b></div>
    <div class="tower player right" data-hp="100"><span>TORRE</span><b>100</b></div>
    <div class="midline"></div>
    <div id="units"></div>
    <div id="effects"></div>
  </section>

  <div class="message" id="message">Escolha uma carta para invocar.</div>

  <section class="hand" id="hand"></section>
  <button class="reset" id="reset">Novo duelo</button>
</main>
<script src="script.js"></script>
</body>
</html>
