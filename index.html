<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Jogo da Velha</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <section class="card">
      <header>
        <p class="eyebrow">JOGO DA VELHA</p>
        <h1>Você <span>×</span> NPC</h1>
        <p id="status" class="status" aria-live="polite">Sua vez — você é X</p>
      </header>

      <div class="score" aria-label="Placar">
        <div><strong id="playerScore">0</strong><span>Você</span></div>
        <div><strong id="drawScore">0</strong><span>Empates</span></div>
        <div><strong id="npcScore">0</strong><span>NPC</span></div>
      </div>

      <div id="board" class="board" role="grid" aria-label="Tabuleiro do jogo"></div>

      <div class="actions">
        <button id="newRound" class="primary">Nova rodada</button>
        <button id="resetScore" class="secondary">Zerar placar</button>
      </div>

      <p class="tip">O NPC joga sozinho. Tente vencê-lo!</p>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
